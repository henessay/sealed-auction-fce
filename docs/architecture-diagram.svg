<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="ui-monospace, 'Cascadia Code', Menlo, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a7"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e62058"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#0b0e14"/>

  <text x="480" y="42" text-anchor="middle" fill="#e6e9f0" font-size="22" font-weight="bold">SealedAuction — Flare Confidential Extension</text>
  <text x="480" y="66" text-anchor="middle" fill="#8b93a7" font-size="13">bid amounts never touch the chain</text>

  <!-- Browser -->
  <rect x="40" y="110" width="200" height="120" rx="10" fill="#131722" stroke="#262d40"/>
  <text x="140" y="138" text-anchor="middle" fill="#e6e9f0" font-size="15" font-weight="bold">Bidder's browser</text>
  <text x="140" y="163" text-anchor="middle" fill="#8b93a7" font-size="12">amount + salt</text>
  <text x="140" y="183" text-anchor="middle" fill="#34d399" font-size="12">ECIES encrypt</text>
  <text x="140" y="203" text-anchor="middle" fill="#8b93a7" font-size="12">under TEE pubkey</text>

  <!-- Contract -->
  <rect x="330" y="110" width="230" height="120" rx="10" fill="#131722" stroke="#262d40"/>
  <text x="445" y="138" text-anchor="middle" fill="#e6e9f0" font-size="15" font-weight="bold">SealedAuction.sol</text>
  <text x="445" y="163" text-anchor="middle" fill="#8b93a7" font-size="12">wraps ciphertext with</text>
  <text x="445" y="183" text-anchor="middle" fill="#fbbf24" font-size="12">msg.sender (auth wrapper)</text>
  <text x="445" y="203" text-anchor="middle" fill="#8b93a7" font-size="12">stores commitment only</text>

  <!-- TEE -->
  <rect x="650" y="95" width="270" height="150" rx="10" fill="#131722" stroke="#e62058" stroke-width="1.5"/>
  <text x="785" y="123" text-anchor="middle" fill="#e6e9f0" font-size="15" font-weight="bold">TEE extension (Go)</text>
  <text x="785" y="148" text-anchor="middle" fill="#8b93a7" font-size="12">decrypts bids in memory</text>
  <text x="785" y="168" text-anchor="middle" fill="#8b93a7" font-size="12">checks bidder == wrapper.bidder</text>
  <text x="785" y="188" text-anchor="middle" fill="#34d399" font-size="12">picks winner after deadline</text>
  <text x="785" y="208" text-anchor="middle" fill="#e62058" font-size="12">signs result (secp256k1)</text>
  <text x="785" y="228" text-anchor="middle" fill="#8b93a7" font-size="11">plaintext never leaves the enclave</text>

  <!-- Flow arrows top -->
  <line x1="240" y1="170" x2="325" y2="170" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="283" y="160" text-anchor="middle" fill="#8b93a7" font-size="11">placeBid(ct)</text>

  <line x1="560" y1="170" x2="645" y2="170" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="602" y="150" text-anchor="middle" fill="#8b93a7" font-size="11">instruction via</text>
  <text x="602" y="164" text-anchor="middle" fill="#8b93a7" font-size="11">indexer + proxy</text>

  <!-- Settlement row -->
  <rect x="330" y="330" width="230" height="120" rx="10" fill="#131722" stroke="#262d40"/>
  <text x="445" y="358" text-anchor="middle" fill="#e6e9f0" font-size="15" font-weight="bold">settle()</text>
  <text x="445" y="383" text-anchor="middle" fill="#8b93a7" font-size="12">verifies TEE signature</text>
  <text x="445" y="403" text-anchor="middle" fill="#8b93a7" font-size="12">ecrecover == teeAddress</text>
  <text x="445" y="423" text-anchor="middle" fill="#34d399" font-size="12">FXRP: winner → seller</text>

  <rect x="650" y="330" width="270" height="120" rx="10" fill="#131722" stroke="#262d40"/>
  <text x="785" y="358" text-anchor="middle" fill="#e6e9f0" font-size="15" font-weight="bold">FXRP (FAsset)</text>
  <text x="785" y="383" text-anchor="middle" fill="#8b93a7" font-size="12">resolved dynamically:</text>
  <text x="785" y="403" text-anchor="middle" fill="#fbbf24" font-size="11">ContractRegistry → AssetManagerFXRP</text>
  <text x="785" y="423" text-anchor="middle" fill="#fbbf24" font-size="11">→ fAsset()</text>

  <rect x="40" y="330" width="200" height="120" rx="10" fill="#131722" stroke="#262d40"/>
  <text x="140" y="358" text-anchor="middle" fill="#e6e9f0" font-size="15" font-weight="bold">Anyone</text>
  <text x="140" y="383" text-anchor="middle" fill="#8b93a7" font-size="12">closeAuction()</text>
  <text x="140" y="403" text-anchor="middle" fill="#8b93a7" font-size="12">after the deadline</text>
  <text x="140" y="423" text-anchor="middle" fill="#8b93a7" font-size="12">relays signed result</text>

  <!-- Bottom arrows -->
  <line x1="240" y1="390" x2="325" y2="390" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="645" y1="390" x2="565" y2="390" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="602" y="380" text-anchor="middle" fill="#8b93a7" font-size="11">transferFrom</text>

  <!-- TEE result down to settle -->
  <path d="M 785 245 C 785 290, 500 290, 460 325" fill="none" stroke="#e62058" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="660" y="292" text-anchor="middle" fill="#e62058" font-size="11">signed (winner, clearingPrice)</text>

  <!-- On-chain visibility strip -->
  <rect x="40" y="480" width="880" height="36" rx="8" fill="#1a1f2e" stroke="#262d40"/>
  <text x="480" y="503" text-anchor="middle" fill="#8b93a7" font-size="12">on-chain: ciphertext + commitment + winner + clearing price — <tspan fill="#34d399">losing bids are never revealed</tspan></text>
</svg>
